name: Java verification

on:
  push:
    paths:
      - "implementations/java/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "implementations/java/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: implementations/java/pom.xml
      - name: Verify warnings, tests, coverage, and documentation
        run: mvn -B -ntp clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-quality-reports
          path: |
            implementations/java/target/surefire-reports/
            implementations/java/target/site/jacoco/
